[build]
publish = "."

[[redirects]]
from = "/.well-known/ai-catalog.json"
to = "/.well-known/ard.json"
status = 301
force = true

[[redirects]]
from = "/index.html"
to = "/"
status = 301

[[headers]]
for = "/sitemap.xml"
[headers.values]
Content-Type = "application/xml; charset=utf-8"

[[headers]]
for = "/robots.txt"
[headers.values]
Content-Type = "text/plain; charset=utf-8"

[[headers]]
for = "/llms.txt"
[headers.values]
Content-Type = "text/plain; charset=utf-8"
